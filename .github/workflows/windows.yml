name: Windows
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach Windows ZIP to the matching existing stable release
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test model storage and recording cleanup
        run: python -m unittest discover -s windows/tests -v
      - name: Package and check the Windows app
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/release
      - name: Add Windows download and preserve other platform checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python windows/publish.py "${{ github.repository }}"

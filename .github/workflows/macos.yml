name: macOS
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck desktop app
        run: cd desktop && npm install --no-audit --no-fund && npm run typecheck
      - name: Build desktop app
        run: ./build-macos.sh
      - name: Validate installer and bundle metadata
        run: |
          bash -n build-macos.sh install-macos.sh uninstall-macos.sh dictait-memory.sh
          plutil -lint desktop/build/entitlements.mac.plist dist/Dictait.app/Contents/Info.plist
      - name: Upload source-built app
        uses: actions/upload-artifact@v4
        with:
          name: Dictait-macOS-arm64
          path: dist/Dictait.app
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s macos/tests -v
